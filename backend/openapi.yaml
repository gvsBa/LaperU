openapi: 3.1.0
info:
  title: LaperU API
  version: 0.1.0
  description: >-
    REST API lokal untuk Guest, Customer, UMKM, dan Admin LaperU.
    Body JSON rusak mendapat 400 INVALID_JSON; body lebih dari 1 MiB mendapat
    413 PAYLOAD_TOO_LARGE. Login/registrasi dibatasi 30 permintaan per 15 menit
    per IP di luar mode test (429 jika terlampaui). Pengecekan sesi tidak
    memakai kuota login. Email dinormalisasi dengan trim dan huruf kecil.
servers:
  - url: http://127.0.0.1:3000/api/v1
security: []
tags:
  - { name: System, description: Status layanan dan database }
  - { name: Auth, description: 'Registrasi, login, refresh session, dan profil akun' }
  - { name: Guest, description: Penemuan dan detail warung tanpa login }
  - { name: Customer, description: 'Favorit, ulasan, dan laporan Customer' }
  - { name: UMKM, description: Pengajuan serta pengelolaan warung oleh UMKM }
  - { name: Admin, description: 'Verifikasi, moderasi, referensi, dan audit Admin' }
paths:
  /health:
    get:
      tags: [System]
      summary: Memeriksa status API
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /health/database:
    get:
      tags: [System]
      summary: Memeriksa koneksi MySQL
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '500': { $ref: '#/components/responses/Error' }
  /auth/register/customer:
    post:
      tags: [Auth]
      summary: Membuat akun Customer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRegistration' } } }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/register/umkm:
    post:
      tags: [Auth]
      summary: Membuat akun dan draft pengajuan UMKM
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UmkmRegistration' } } }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login seluruh role
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Merotasi refresh token
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Mencabut refresh token
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Mengambil profil akun aktif
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /warungs:
    get:
      tags: [Guest]
      summary: Mencari dan memfilter warung
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: facility, in: query, schema: { type: string } }
        - { name: payment, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minRating, in: query, schema: { type: number, minimum: 1, maximum: 5 } }
        - { name: openNow, in: query, schema: { type: boolean } }
        - { name: latitude, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, description: Membutuhkan latitude dan longitude, schema: { type: number, exclusiveMinimum: 0, maximum: 50 } }
        - { name: sort, in: query, description: nearest membutuhkan latitude dan longitude; recommended menggunakan rating dan jumlah ulasan, schema: { type: string, enum: [recommended, rating, cheapest, nearest] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 12, maximum: 50 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /warungs/{slug}:
    get:
      tags: [Guest]
      summary: Detail warung, menu, jam, fasilitas, dan pembayaran
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /meta:
    get:
      tags: [Guest]
      summary: Pilihan kategori, fasilitas, dan metode pembayaran
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /customer/favorites:
    get:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Melihat favorit
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /customer/favorites/{id}:
    post:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Menambah favorit
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '201': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Menghapus favorit
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /customer/reviews:
    get:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Melihat riwayat ulasan sendiri
      parameters:
        - { name: warungId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Membuat ulasan multidimensi
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /customer/reviews/{id}:
    patch:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Mengubah ulasan sendiri
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviewUpdate' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Menghapus ulasan sendiri
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /customer/reports:
    get:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Melihat maksimal 100 laporan terbaru milik sendiri beserta hasil pemeriksaan
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Customer]
      security: [{ bearerAuth: [] }]
      summary: Melaporkan ulasan atau informasi
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreate' } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /umkm/application:
    get:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Melihat status pengajuan
      description: Response data menyertakan id profil untuk kompatibilitas, profileId, dan submissionId. Gunakan submissionId untuk endpoint keputusan Admin.
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Memperbarui draft atau revisi pengajuan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationUpdate' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/application/submit:
    post:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Mengirim pengajuan ke Admin
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/warung:
    get:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Melihat profil warung sendiri
      description: Response data menyertakan categoryId (UUID atau null) untuk nilai awal form edit kategori.
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Memperbarui profil warung
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WarungUpdate' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/menus:
    get:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Melihat semua menu sendiri
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Menambah menu
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuCreate' } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /umkm/menus/{id}:
    patch:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Mengubah menu sendiri
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuUpdate' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Menonaktifkan menu tanpa menghapus riwayat
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/operating-hours:
    put:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Mengganti jadwal operasional tujuh hari
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OperatingHours' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/facilities:
    put:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Mengganti daftar fasilitas warung
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RelationIds' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/payment-methods:
    put:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Mengganti daftar metode pembayaran warung
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RelationIds' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/reviews:
    get:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Melihat ulasan untuk warung sendiri
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/reviews/{id}/reply:
    put:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Membuat atau memperbarui balasan ulasan
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties: { reply: { type: string, minLength: 1, maxLength: 1500 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/statistics:
    get:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Statistik kunjungan profil, favorit, rating, dan ulasan
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /umkm/uploads/images:
    post:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Mengunggah satu gambar JPG, JPEG, atau PNG maksimal 2 MB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties: { image: { type: string, format: binary } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /umkm/photos:
    post:
      tags: [UMKM]
      security: [{ bearerAuth: [] }]
      summary: Menyimpan URL foto warung atau menu
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PhotoCreate' } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /admin/users:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Melihat dan memfilter akun Customer atau UMKM
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/warungs:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Melihat daftar warung
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/warungs/{id}:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Mengubah data warung
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminWarungUpdate' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Menonaktifkan warung tanpa menghapus riwayat
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/categories:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Membuat kategori makanan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceData' } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /admin/categories/{id}:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Mengubah kategori makanan
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceData' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Menghapus kategori makanan
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/facilities:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Membuat fasilitas
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceData' } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /admin/facilities/{id}:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Mengubah fasilitas
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceData' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Menghapus fasilitas
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/dashboard:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Ringkasan jumlah pengguna, UMKM, warung aktif, dan laporan
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/applications:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Daftar dan filter pengajuan UMKM
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/applications/{id}:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Detail pengajuan UMKM
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/applications/{id}/decision:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Menyetujui, meminta revisi, atau menolak pengajuan
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationDecision' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/users/{id}/status:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Mengaktifkan atau menangguhkan akun
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserStatusUpdate' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/reports:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Melihat laporan pengguna
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/reports/{id}:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Menyelesaikan atau mengabaikan laporan
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportStatusUpdate' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/reviews:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Daftar ulasan untuk moderasi Admin
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/reviews/{id}/status:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Menampilkan atau menyembunyikan ulasan
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviewModeration' } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /admin/audit-logs:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Melihat riwayat tindakan Admin
      responses: { '200': { $ref: '#/components/responses/Success' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Slug: { name: slug, in: path, required: true, schema: { type: string } }
  schemas:
    CustomerRegistration:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 8, maxLength: 72, description: 'Wajib huruf dan angka; maksimal 72 byte UTF-8, bukan hanya 72 karakter.' }
    UmkmRegistration:
      allOf:
        - { $ref: '#/components/schemas/CustomerRegistration' }
        - type: object
          required: [businessName, ownerName, phone, address]
          properties:
            businessName: { type: string }
            ownerName: { type: string }
            phone: { type: string }
            address: { type: string }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 1, maxLength: 72 }
    Review:
      type: object
      required: [warungId, tasteRating, priceRating, portionRating, cleanlinessRating, comfortRating, speedRating]
      properties:
        warungId: { type: string, format: uuid }
        tasteRating: { type: integer, minimum: 1, maximum: 5 }
        priceRating: { type: integer, minimum: 1, maximum: 5 }
        portionRating: { type: integer, minimum: 1, maximum: 5 }
        cleanlinessRating: { type: integer, minimum: 1, maximum: 5 }
        comfortRating: { type: integer, minimum: 1, maximum: 5 }
        speedRating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1500 }
    RelationIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
    ReviewUpdate:
      type: object
      minProperties: 1
      properties:
        tasteRating: { type: integer, minimum: 1, maximum: 5 }
        priceRating: { type: integer, minimum: 1, maximum: 5 }
        portionRating: { type: integer, minimum: 1, maximum: 5 }
        cleanlinessRating: { type: integer, minimum: 1, maximum: 5 }
        comfortRating: { type: integer, minimum: 1, maximum: 5 }
        speedRating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1500 }
    ReportCreate:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [INFORMATION, REVIEW, WARUNG] }
        targetId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 160 }
        detail: { type: string, maxLength: 1200 }
    ApplicationUpdate:
      type: object
      minProperties: 1
      properties:
        address: { type: string, minLength: 8, maxLength: 500 }
        businessName: { type: string, minLength: 2, maxLength: 160 }
        businessType: { type: string, maxLength: 100 }
        ownerName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 8, maxLength: 30 }
        storefrontPhotoUrl: { type: string, format: uri, maxLength: 1000 }
    WarungUpdate:
      type: object
      minProperties: 1
      properties:
        address: { type: string, minLength: 8, maxLength: 500 }
        categoryId: { type: [string, 'null'], format: uuid }
        description: { type: string, maxLength: 2000 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: [string, 'null'], maxLength: 30 }
        priceMin: { type: [integer, 'null'], minimum: 0 }
        priceMax: { type: [integer, 'null'], minimum: 0 }
        statusOverride: { type: string, enum: [AUTO, CLOSED, OPEN] }
    MenuCreate:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        price: { type: integer, minimum: 0 }
        isAvailable: { type: boolean, default: true }
        photoUrl: { type: string, format: uri, maxLength: 1000 }
    MenuUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        price: { type: integer, minimum: 0 }
        isAvailable: { type: boolean }
        photoUrl: { type: string, format: uri, maxLength: 1000 }
        isActive: { type: boolean }
    OperatingHours:
      type: object
      required: [hours]
      properties:
        hours:
          type: array
          description: Tepat tujuh hari unik, 0=Senin sampai 6=Minggu. Hari operasional (isClosed=false) wajib memiliki openTime dan closeTime, dengan closeTime setelah openTime. Jadwal lintas tengah malam belum didukung.
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [dayOfWeek, openTime, closeTime, isClosed]
            properties:
              dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
              openTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
              closeTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
              isClosed: { type: boolean }
    PhotoCreate:
      type: object
      required: [type, url]
      properties:
        type: { type: string, enum: [MENU, STOREFRONT, VENUE] }
        url: { type: string, format: uri, maxLength: 1000 }
        altText: { type: string, maxLength: 255 }
    AdminWarungUpdate:
      type: object
      minProperties: 1
      properties:
        address: { type: string, minLength: 8, maxLength: 500 }
        categoryId: { type: [string, 'null'], format: uuid }
        description: { type: string, maxLength: 2000 }
        isActive: { type: boolean }
        name: { type: string, minLength: 2, maxLength: 160 }
    ReferenceData:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 2, maxLength: 100 } }
    ApplicationDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED, REVISION] }
        note: { type: string, maxLength: 1000 }
    UserStatusUpdate:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ACTIVE, SUSPENDED] } }
    ReportStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DISMISSED, RESOLVED] }
        adminNote: { type: string, maxLength: 1000 }
    ReviewModeration:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [HIDDEN, VISIBLE] } }
    ApiError:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, const: false }
        code: { type: string }
        message: { type: string }
  responses:
    Success:
      description: Permintaan berhasil
      content:
        application/json:
          schema:
            type: object
            properties: { success: { type: boolean, const: true }, data: {} }
    AuthSuccess:
      description: Autentikasi berhasil dan refresh cookie HTTP-only dikirim
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data:
                type: object
                properties: { accessToken: { type: string }, user: { type: object } }
    Error:
      description: Permintaan gagal
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
